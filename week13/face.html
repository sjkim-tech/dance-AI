<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>표정의 잔상</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#14110d;color:#efe6d6;font-family:'Noto Serif KR',serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
video{display:none}
#title{position:fixed;left:24px;top:20px;font-size:18px;letter-spacing:.08em;opacity:.8;z-index:2}
#hud{position:fixed;left:24px;bottom:20px;font:11px 'IBM Plex Mono',monospace;color:#b9a888;line-height:1.8;z-index:2}
#back{position:fixed;right:24px;top:20px;font:12px 'IBM Plex Mono',monospace;color:#b9a888;text-decoration:none;z-index:4}
#start{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#14110d;text-align:center;padding:24px}
#start h1{font-size:40px;font-weight:600}
#start p{color:#b9a888;font-size:15px;line-height:1.8;max-width:520px}
#start button{font:inherit;font-size:16px;color:#14110d;background:#d9a441;border:none;border-radius:999px;padding:12px 32px;cursor:pointer}
#msg{font:12px 'IBM Plex Mono',monospace;color:#d9a441;min-height:18px}
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<canvas id="c"></canvas>
<div id="title">표정의 잔상</div>
<a id="back" href="../Dance_AI_vibe_week13.html">← 13주차</a>
<div id="hud"></div>
<div id="start">
  <h1>표정의 잔상</h1>
  <p>미소는 색온도, 눈썹 올림은 입자 상승, 깜빡임은 화면 섬광이 됩니다.<br>微笑是色温,抬眉是粒子上升,眨眼是画面闪光。</p>
  <button id="go">카메라 켜기 · 打开摄像头</button>
  <div id="msg"></div>
</div>
<script type="module">
import {FilesetResolver, FaceLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const WASM="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const video=document.getElementById('v'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
const msg=document.getElementById('msg'),hud=document.getElementById('hud');
let W,H,face=null,lastTS=0,lastVT=-1;
let warm=0,flash=0,blinkWas=false,particles=[];
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;ctx.fillStyle='#14110d';ctx.fillRect(0,0,W,H);}
addEventListener('resize',resize);resize();

// 영상 좌표(0~1) → 화면 좌표. 화면을 채우고 거울처럼 좌우 반전
function P(l){
  const vw=video.videoWidth||1280,vh=video.videoHeight||720,s=Math.max(W/vw,H/vh);
  const dw=vw*s,dh=vh*s,ox=(W-dw)/2,oy=(H-dh)/2;
  return {x:W-(ox+l.x*dw),y:oy+l.y*dh};
}
const lerp=(a,b,t)=>a+(b-a)*t;

document.getElementById('go').onclick=async()=>{
  try{
    msg.textContent='카메라 켜는 중…';
    const s=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'},audio:false});
    video.srcObject=s;await video.play();
    msg.textContent='얼굴 모델 불러오는 중…';
    const fs=await FilesetResolver.forVisionTasks(WASM);
    face=await FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:MODEL,delegate:'GPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true});
    document.getElementById('start').style.display='none';
    requestAnimationFrame(loop);
  }catch(e){msg.textContent='오류: '+e.message;}
};

let res=null;
function loop(){
  requestAnimationFrame(loop);
  if(video.readyState>=2&&video.currentTime!==lastVT){
    lastVT=video.currentTime;
    const ts=Math.max(performance.now(),lastTS+1);lastTS=ts;   // timestamp는 항상 증가
    res=face.detectForVideo(video,ts);
  }
  // 완전히 지우지 않고 반투명한 어두운 사각형으로 덮어 잔상을 남김
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(20,17,13,0.09)';ctx.fillRect(0,0,W,H);

  const lm=res&&res.faceLandmarks&&res.faceLandmarks[0];
  if(lm){
    const bs={};(res.faceBlendshapes[0]?.categories||[]).forEach(c=>bs[c.categoryName]=c.score);
    const smile=((bs.mouthSmileLeft||0)+(bs.mouthSmileRight||0))/2;
    const brow=Math.max(bs.browInnerUp||0,((bs.browOuterUpLeft||0)+(bs.browOuterUpRight||0))/2);
    const blink=((bs.eyeBlinkLeft||0)+(bs.eyeBlinkRight||0))/2;

    // 미소 → 색온도 (차가운 흰색에서 황토색으로)
    warm=lerp(warm,Math.min(1,smile*1.6),0.08);
    const r=Math.round(lerp(196,226,warm)),g=Math.round(lerp(208,164,warm)),b=Math.round(lerp(222,70,warm));
    ctx.fillStyle=`rgba(${r},${g},${b},0.75)`;
    for(let i=0;i<lm.length;i++){const p=P(lm[i]);ctx.fillRect(p.x,p.y,1.6,1.6);}

    // 눈썹 올림 → 눈썹에서 입자가 위로
    if(brow>0.25){
      const n=Math.floor(brow*6);
      for(const idx of [70,105,107,336,334,300]){
        for(let k=0;k<n;k++){const p=P(lm[idx]);particles.push({x:p.x+(Math.random()-.5)*30,y:p.y,vx:(Math.random()-.5)*0.8,vy:-(1+Math.random()*3*brow),life:1,c:`${r},${g},${b}`});}
      }
    }
    // 깜빡임 → 화면 섬광
    if(blink>0.55&&!blinkWas){flash=0.5;}
    blinkWas=blink>0.55;
    hud.innerHTML=`smile ${smile.toFixed(2)}<br>brow&nbsp; ${brow.toFixed(2)}<br>blink ${blink.toFixed(2)}`;
  }else hud.textContent='얼굴을 찾는 중 · 正在寻找脸';

  ctx.globalCompositeOperation='lighter';
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy*=0.99;p.life-=0.012;ctx.fillStyle=`rgba(${p.c},${Math.max(0,p.life)*0.8})`;ctx.fillRect(p.x,p.y,2,2);}
  particles=particles.filter(p=>p.life>0&&p.y>-10);
  if(particles.length>3000)particles.splice(0,particles.length-3000);
  if(flash>0.01){ctx.fillStyle=`rgba(239,230,214,${flash})`;ctx.fillRect(0,0,W,H);flash*=0.8;}
}
</script>
</body>
</html>
